<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>netinv</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1b1f24;--mute:#667085;--line:#e3e6ea;--accent:#2563eb;--ok:#15803d;--warn:#b45309;--bar:#3b82f6}
@media(prefers-color-scheme:dark){:root{--bg:#0f1216;--card:#181c22;--ink:#e6e9ee;--mute:#9aa4b2;--line:#2a3038;--accent:#7aa7ff;--ok:#4ade80;--warn:#fbbf24;--bar:#5b9bff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{display:flex;align-items:baseline;gap:12px;padding:16px 20px 0}
h1{font-size:18px;margin:0}h2{font-size:14px;margin:0 0 10px}
.mute{color:var(--mute)}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px}
main{padding:16px 20px 40px;max-width:1280px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
.tile b{display:block;font-size:26px;font-weight:650}
.tile.alert b{color:var(--warn)}
nav{display:flex;gap:4px;margin-bottom:12px}
nav button,.seg button{background:none;border:1px solid transparent;color:var(--mute);padding:6px 12px;border-radius:8px;font:inherit;cursor:pointer}
nav button[aria-selected=true],.seg button[aria-pressed=true]{background:var(--card);border-color:var(--line);color:var(--ink);font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:900px){.grid2{grid-template-columns:1fr}}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-weight:600;color:var(--mute);font-size:12px;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top;overflow-wrap:anywhere}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}tbody tr.click:hover,tbody tr.sel{background:color-mix(in srgb,var(--accent) 9%,transparent)}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--line);margin-right:6px}
.dot.on{background:var(--ok)}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:99px;border:1px solid var(--line);color:var(--mute);margin-left:6px;white-space:nowrap}
.tag.new{color:var(--warn);border-color:var(--warn)}
input[type=text],input[type=search]{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font:inherit;width:100%;max-width:340px}
button.act{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:7px 12px;font:inherit;cursor:pointer}
button.ghost{background:none;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:7px 12px;font:inherit;cursor:pointer}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.chart{display:flex;align-items:flex-end;gap:2px;height:90px;border-bottom:1px solid var(--line)}
.chart i{flex:1;background:var(--bar);border-radius:2px 2px 0 0;min-height:1px}
.axis{display:flex;justify-content:space-between;font-size:11px;color:var(--mute);margin-top:4px}
.empty{color:var(--mute);padding:14px 4px}
.scroll{max-height:560px;overflow:auto}
[hidden]{display:none!important}
</style>
</head>
<body>
<header><h1>netinv</h1><span class="mute" id="status">loading…</span></header>
<main>
  <section class="tiles" id="tiles"></section>
  <nav role="tablist">
    <button role="tab" data-tab="devices" aria-selected="true">Devices</button>
    <button role="tab" data-tab="domains" aria-selected="false">Domains</button>
    <button role="tab" data-tab="live" aria-selected="false">Live</button>
  </nav>

  <section id="tab-devices" class="grid2">
    <div class="card">
      <div class="row"><input type="search" id="devfilter" placeholder="Filter by name, IP, MAC, vendor" aria-label="Filter devices"></div>
      <div class="scroll"><table><thead><tr><th>Device</th><th>IP</th><th>MAC / vendor</th><th class="num">Lookups 24h</th><th class="num">Last seen</th></tr></thead><tbody id="devrows"></tbody></table></div>
    </div>
    <div class="card" id="detail"><div class="empty">Select a device to see what it has been looking up.</div></div>
  </section>

  <section id="tab-domains" hidden>
    <div class="card" style="margin-bottom:12px">
      <h2>Lookups per hour, last 24h</h2>
      <div id="netchart"></div>
    </div>
    <div class="grid2">
      <div class="card"><h2>Top domains, last 24h</h2><div id="top"></div></div>
      <div class="card"><h2>First seen in the last 24h</h2><div id="fresh"></div></div>
    </div>
    <div class="card" style="margin-top:12px">
      <h2>Which devices looked up…</h2>
      <div class="row"><input type="search" id="domq" placeholder="e.g. tiktok, amazonaws.com" aria-label="Search domains"><button class="act" id="domgo">Search</button></div>
      <div id="domres"></div>
    </div>
  </section>

  <section id="tab-live" hidden>
    <div class="card"><h2>Most recent lookups</h2><div class="scroll" id="live"></div></div>
  </section>
</main>
<script>
"use strict";
const $ = s => document.querySelector(s);
// Every string from the network (hostnames, domains, vendors) goes in via textContent, never innerHTML.
function el(tag, attrs, ...kids){
  const e = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs||{})) {
    if (k === "class") e.className = v; else if (k.startsWith("on")) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k != null) e.append(k.nodeType ? k : document.createTextNode(String(k)));
  return e;
}
const api = (p) => fetch(p).then(r => r.json());
const fmt = n => Number(n).toLocaleString();
function ago(ts){
  if (!ts) return "never";
  const s = Math.max(0, Date.now()/1000 - ts);
  if (s < 90) return "just now";
  if (s < 3600) return Math.round(s/60) + "m ago";
  if (s < 86400) return Math.round(s/3600) + "h ago";
  return Math.round(s/86400) + "d ago";
}
const hourLabel = ts => new Date(ts*1000).toLocaleString([], {month:"short", day:"numeric", hour:"numeric"});
const devName = d => d.label || d.hostname || d.vendor || d.mac;

function table(heads, rows){
  if (!rows.length) return el("div", {class:"empty"}, "Nothing yet.");
  return el("table", {}, el("thead", {}, el("tr", {}, heads.map(h => el("th", {class: h.num ? "num" : ""}, h.t)))), el("tbody", {}, rows));
}
function chart(points, hours){
  // fill gaps so quiet hours show as empty slots
  const now = Math.floor(Date.now()/1000), end = now - now % 3600, by = new Map(points.map(p => [p.hour, p.c]));
  const n = Math.min(hours, 24*14), step = Math.ceil(hours / n) * 3600, bars = [];
  for (let t = end - (n-1)*step; t <= end; t += step){
    let c = 0; for (let h = t; h < t + step; h += 3600) c += by.get(h) || 0;
    bars.push({t, c});
  }
  const max = Math.max(1, ...bars.map(b => b.c));
  return el("div", {},
    el("div", {class:"chart", role:"img", "aria-label":"Lookups over time, peak " + fmt(max)},
      bars.map(b => el("i", {style:`height:${b.c/max*100}%`, title:`${hourLabel(b.t)}: ${fmt(b.c)} lookups`}))),
    el("div", {class:"axis"}, el("span", {}, hourLabel(bars[0].t)), el("span", {}, "peak " + fmt(max) + (step > 3600 ? ` per ${step/3600}h` : "/h")), el("span", {}, "now")));
}

let devices = [], selected = null, range = 24, group = "base";

async function loadSummary(){
  const s = await api("/api/summary");
  $("#status").textContent = s.last_scan ? "last scan " + ago(s.last_scan) : "waiting for first scan";
  const tile = (n, label, alert) => el("div", {class:"card tile" + (alert ? " alert" : "")}, el("b", {}, fmt(n)), el("span", {class:"mute"}, label));
  $("#tiles").replaceChildren(
    tile(s.total, "devices seen"), tile(s.online, "online now"),
    tile(s.unknown, "not yet reviewed", s.unknown > 0),
    tile(s.queries, "DNS lookups, 24h"), tile(s.domains, "distinct domains, 24h"));
  $("#netchart").replaceChildren(chart(s.hourly, 24));
  $("#top").replaceChildren(table([{t:"Domain"},{t:"Devices",num:1},{t:"Lookups",num:1}],
    s.top.map(r => el("tr", {class:"click", onclick:() => searchDomain(r.name)}, el("td", {class:"mono"}, r.name), el("td", {class:"num"}, r.devs), el("td", {class:"num"}, fmt(r.c))))));
  $("#fresh").replaceChildren(table([{t:"Domain"},{t:"Devices",num:1},{t:"First seen",num:1}],
    s.fresh.map(r => el("tr", {class:"click", onclick:() => searchDomain(r.name)}, el("td", {class:"mono"}, r.name), el("td", {class:"num"}, r.devs), el("td", {class:"num"}, hourLabel(r.first))))));
}

async function loadDevices(){
  devices = await api("/api/devices");
  renderDevices();
}
function renderDevices(){
  const f = $("#devfilter").value.trim().toLowerCase();
  const rows = devices.filter(d => !f || [d.label,d.hostname,d.vendor,d.mac,d.ip].join(" ").toLowerCase().includes(f)).map(d =>
    el("tr", {class:"click" + (d.mac === selected ? " sel" : ""), onclick:() => select(d.mac)},
      el("td", {}, el("span", {class:"dot" + (d.online ? " on" : ""), title: d.online ? "online" : "offline"}), devName(d),
        d.known ? null : el("span", {class:"tag new"}, "new"), d.randomized ? el("span", {class:"tag", title:"Locally administered (private/randomized) MAC address"}, "private MAC") : null),
      el("td", {class:"mono", style:"white-space:nowrap"}, d.ip || ""),
      el("td", {}, el("div", {class:"mono"}, d.mac.startsWith("ip:") ? "MAC not seen" : d.mac), el("div", {class:"mute"}, d.vendor || "")),
      el("td", {class:"num"}, fmt(d.queries)),
      el("td", {class:"num"}, ago(d.last_seen))));
  $("#devrows").replaceChildren(...(rows.length ? rows : [el("tr", {}, el("td", {colspan:5, class:"empty"}, devices.length ? "No match." : "No devices yet. The first scan runs at startup."))]));
}
async function update(mac, patch){
  await fetch("/api/device", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({mac, ...patch})});
  await Promise.all([loadDevices(), loadSummary()]);
  renderDetail();
}
function select(mac){ selected = mac; renderDevices(); renderDetail(); }
async function renderDetail(){
  const d = devices.find(x => x.mac === selected);
  if (!d) return;
  const data = await api(`/api/device?mac=${encodeURIComponent(d.mac)}&hours=${range}&group=${group}`);
  if (selected !== d.mac) return;
  const real = !d.mac.startsWith("ip:");
  const name = el("input", {type:"text", value:d.label || "", placeholder:"Label, e.g. Living room TV", "aria-label":"Device label"});
  const seg = (opts, cur, set) => el("span", {class:"seg"}, opts.map(([v,t]) => el("button", {"aria-pressed": String(v === cur), onclick:() => { set(v); renderDetail(); }}, t)));
  $("#detail").replaceChildren(
    el("h2", {}, devName(d)),
    el("div", {class:"mute", style:"margin-bottom:10px"}, [d.ip, real ? d.mac : null, d.hostname, d.vendor].filter(Boolean).join(" · "),
      real ? ` · first seen ${new Date(d.first_seen*1000).toLocaleDateString()}` : ""),
    real ? el("div", {class:"row"}, name,
      el("button", {class:"act", onclick:() => update(d.mac, {label:name.value})}, "Save"),
      el("button", {class:"ghost", onclick:() => update(d.mac, {known: !d.known})}, d.known ? "Mark as not reviewed" : "Mark as reviewed")) : null,
    el("div", {class:"row"}, seg([[24,"24h"],[168,"7d"],[720,"30d"]], range, v => range = v), seg([["base","By site"],["domain","Full hostnames"]], group, v => group = v)),
    chart(data.hourly, range),
    el("div", {class:"scroll", style:"margin-top:12px;max-height:380px"}, table([{t:"Domain"},{t:"Lookups",num:1},{t:"Last",num:1}],
      data.top.map(r => el("tr", {}, el("td", {class:"mono"}, r.name), el("td", {class:"num"}, fmt(r.c)), el("td", {class:"num"}, ago(Math.min(r.last + 3599, Date.now()/1000))))))));
}

async function searchDomain(q){
  if (q) { $("#domq").value = q; }
  const term = $("#domq").value.trim();
  if (term.length < 2) return;
  const rows = await api("/api/domain?q=" + encodeURIComponent(term));
  $("#domres").replaceChildren(table([{t:"Domain"},{t:"Device"},{t:"Lookups",num:1},{t:"First",num:1},{t:"Last",num:1}],
    rows.map(r => el("tr", {}, el("td", {class:"mono"}, r.domain), el("td", {}, r.label || r.hostname || r.vendor || r.dev),
      el("td", {class:"num"}, fmt(r.c)), el("td", {class:"num"}, hourLabel(r.first)), el("td", {class:"num"}, hourLabel(r.last))))));
  $("#domres").scrollIntoView({block:"nearest"});
}
async function loadLive(){
  const rows = await api("/api/live");
  $("#live").replaceChildren(table([{t:"Time"},{t:"Device"},{t:"Type"},{t:"Domain"}],
    rows.map(r => el("tr", {}, el("td", {class:"mono"}, new Date(r.ts*1000).toLocaleTimeString()), el("td", {}, r.name), el("td", {class:"mono"}, r.type), el("td", {class:"mono"}, r.domain)))));
}

let tab = "devices";
document.querySelectorAll("nav button").forEach(b => b.addEventListener("click", () => {
  tab = b.dataset.tab;
  document.querySelectorAll("nav button").forEach(x => x.setAttribute("aria-selected", String(x === b)));
  for (const t of ["devices","domains","live"]) $("#tab-" + t).hidden = t !== tab;
  refresh();
}));
$("#devfilter").addEventListener("input", renderDevices);
$("#domgo").addEventListener("click", () => searchDomain());
$("#domq").addEventListener("keydown", e => { if (e.key === "Enter") searchDomain(); });

async function refresh(){
  try {
    await loadSummary();
    if (tab === "devices") await loadDevices();
    if (tab === "live") await loadLive();
  } catch (e) { $("#status").textContent = "cannot reach netinv"; }
}
refresh();
setInterval(refresh, 15000);
</script>
</body>
</html>
